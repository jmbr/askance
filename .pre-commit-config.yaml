# Install with `prek install`; run all hooks with `prek run --all-files`.
# Local hooks call nox sessions so each check has one definition.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks

  # semantic-release derives versions from commit subjects. Use a linter that cannot
  # update versions; semantic-release remains the only version writer.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.30
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: nox-format
        name: nox -s format
        entry: uvx nox -R -s format
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false

      - id: nox-skills
        name: nox -s skills
        entry: uvx nox -R -s skills
        language: system
        files: ^skills/
        pass_filenames: false

      # Always run before a push because tests inspect README.md. `-r` rebuilds the
      # session so the suite tests a fresh wheel.
      - id: nox-tests
        name: nox -s tests
        entry: uvx nox -r -s tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
