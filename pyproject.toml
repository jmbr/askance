[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "askance"
version = "0.2.0"
description = "An MCP server for hypothesis testing, backed by SciPy and statsmodels"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "statistics", "hypothesis-testing", "scipy", "statsmodels"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mcp>=2.2,<3",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "python-semantic-release>=10.6"]

[project.scripts]
askance = "askance.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

# Only semantic-release may update the version, tag, or changelog.
[tool.semantic_release]
commit_parser = "conventional"
# The package reads this value through installed metadata.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
# Below 1.0, a breaking change produces a minor bump. Revisit at 1.0.
major_on_zero = false
# Releases create no package artifacts.
build_command = ""
upload_to_vcs_release = false
# `chore` passes the commit hook but does not trigger another release.
commit_message = "chore(release): v{version}"
commit_author = "askance release bot <askance@localhost>"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
# The runner supplies the internal API URL through GITEA_SERVER_URL. Pushes go through the
# checkout's own origin, which actions/checkout authenticated; `domain` only builds links.
type = "gitea"
domain = "http://localhost:3000"
api_domain = { env = "GITEA_SERVER_URL" }
token = { env = "GITEA_TOKEN" }
insecure = true
ignore_token_for_push = true

[tool.semantic_release.changelog]
# Exclude maintenance-only changes from the changelog.
exclude_commit_patterns = ["^chore(\\(.*\\))?: ", "^ci(\\(.*\\))?: ", "^style(\\(.*\\))?: "]
