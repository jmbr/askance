[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "askance"
version = "0.3.0"
description = "An MCP server for hypothesis testing, backed by SciPy and statsmodels"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "statistics", "hypothesis-testing", "scipy", "statsmodels"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mcp>=2.2,<3",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[dependency-groups]
# uv.lock pins every group; nox sessions install from it, so checks run the locked versions.
test = ["pytest>=8.0"]
lint = ["ruff>=0.8"]
skills = ["skills-ref>=0.1.1"]
release = ["python-semantic-release>=10.6"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "skills" },
    { include-group = "release" },
]

[project.scripts]
askance = "askance.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

# Only semantic-release may update the version, tag, or changelog.
[tool.semantic_release]
commit_parser = "conventional"
# The package reads this value through installed metadata.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
# Below 1.0, a breaking change produces a minor bump. Revisit at 1.0.
major_on_zero = false
# Releases create no package artifacts. The build step only refreshes uv.lock, which records
# the project's version, and stages it into the release commit.
build_command = "uv lock && git add uv.lock"
upload_to_vcs_release = false
# `chore` passes the commit hook but does not trigger another release.
commit_message = "chore(release): v{version}"
commit_author = "askance release bot <askance@localhost>"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
# `domain` only builds the links people follow, so it is the public address. The job reaches
# Forgejo at another address: pushes go through the checkout's own origin, which
# actions/checkout authenticated, and API calls go to GITEA_API_URL, which the workflow sets.
# semantic-release's Gitea client ignores `api_domain`.
type = "gitea"
domain = "https://git.superadditive.com"
token = { env = "GITEA_TOKEN" }
insecure = true
ignore_token_for_push = true

[tool.semantic_release.changelog]
# Exclude maintenance-only changes from the changelog.
exclude_commit_patterns = ["^chore(\\(.*\\))?: ", "^ci(\\(.*\\))?: ", "^style(\\(.*\\))?: "]
