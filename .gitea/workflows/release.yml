name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases push a commit and tag and create a Forgejo release.
permissions: write-all

# Queue releases to avoid partial state.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs prior tags to calculate the next version.
          fetch-depth: 0
          token: ${{ forgejo.token }}

      # The generated release commit triggers this workflow again; stop before doing work.
      - name: Decide whether to run
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "chore(release): "* ]]; then
            echo "run=false" >> "$FORGEJO_OUTPUT"
          else
            echo "run=true" >> "$FORGEJO_OUTPUT"
          fi

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Install the project
        if: steps.guard.outputs.run == 'true'
        run: uv sync --locked

      # `uvx` runs nox as a tool; nox is not a project dependency.
      - name: Check
        if: steps.guard.outputs.run == 'true'
        run: uvx nox -s lint skills tests

      - name: Release
        if: steps.guard.outputs.run == 'true'
        env:
          # python-semantic-release's Gitea remote reads these variable names. The server URL
          # comes from the runner, so it is an address this container can reach.
          GITEA_API_URL: ${{ forgejo.server_url }}/api/v1
          GITEA_TOKEN: ${{ forgejo.token }}
        run: uv run semantic-release version
